# MOVIA — Concesionario Web MVP
# Fase 1: solo PostgreSQL en Docker. Los servicios web y api se contenerizan al final.
services:
  db:
    image: postgres:16-alpine
    container_name: movia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - movia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  movia-pgdata: